[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-router-demo"
version = "0.1.0"
description = "Production-style experiment comparing typed AI decision routing (Jev) with traditional LLM-based routing"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["ai", "machine-learning", "routing", "llm", "jev", "typesafe-ai", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "httpx>=0.27.2",
    "typesafe-sdk>=0.7.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/jev-router-demo"
Documentation = "https://github.com/yourusername/jev-router-demo#readme"
Repository = "https://github.com/yourusername/jev-router-demo"
Issues = "https://github.com/yourusername/jev-router-demo/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
